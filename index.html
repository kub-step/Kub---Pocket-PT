<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket PT | Master Identity System</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --success: #22c55e;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; max-width: 600px; margin: 0 auto; padding-bottom: 80px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 10px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); }
        h1 { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
        
        /* Date Navigator */
        .date-navigator { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 16px; }
        .date-navigator button { background: var(--border); border: none; color: var(--text-main); padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .date-navigator span { font-weight: 600; font-size: 0.95rem; }

        .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
        h2 { font-size: 1rem; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
        input, select, textarea { width: 100%; padding: 10px; background: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 1rem; }
        textarea { resize: vertical; height: 70px; }

        .habit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .habit-btn { background: var(--bg-color); border: 1px solid var(--border); color: var(--text-muted); padding: 12px; border-radius: 8px; text-align: center; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .habit-btn.active { background: var(--success); color: #fff; border-color: var(--success); }

        .btn-primary { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 12px var(--accent-glow); }
        .btn-secondary { background: var(--border); color: var(--text-main); border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 8px; }

        nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid var(--border); max-width: 600px; margin: 0 auto; }
        nav button { background: none; border: none; color: var(--text-muted); font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        nav button.active { color: var(--accent); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <header>
        <h1>Pocket PT</h1>
        <span id="current-streak" style="font-size: 0.85rem; color: var(--success);">🔥 0 Day Streak</span>
    </header>

    <!-- Date Navigator Bar -->
    <div class="date-navigator">
        <button onclick="changeDate(-1)">◀ Prev</button>
        <span id="display-date">Today</span>
        <button onclick="changeDate(1)">Next ▶</button>
    </div>

    <!-- TAB 1: TODAY / LOGGING -->
    <div id="tab-today" class="tab-content active">
        <div class="card">
            <h2>Daily Core Metrics</h2>
            <div class="form-group">
                <label>Body Weight (kg)</label>
                <input type="number" id="log-weight" step="0.1" placeholder="e.g. 78.5">
            </div>
            <div class="form-group">
                <label>Mood & Medication Notes</label>
                <textarea id="log-mood" placeholder="Energy levels, focus, medication impact..."></textarea>
            </div>
        </div>

        <div class="card">
            <h2>Daily Habits</h2>
            <div class="habit-grid">
                <button type="button" class="habit-btn" id="habit-huel" onclick="toggleHabit('huel')">Black Huel</button>
                <button type="button" class="habit-btn" id="habit-gym" onclick="toggleHabit('gym')">Workout Logged</button>
                <button type="button" class="habit-btn" id="habit-steps" onclick="toggleHabit('steps')">10k Steps</button>
                <button type="button" class="habit-btn" id="habit-water" onclick="toggleHabit('water')">Hydration</button>
            </div>
        </div>

        <button class="btn-primary" onclick="saveDailyLog()">Save Entry</button>
    </div>

    <!-- TAB 2: SCOREBOARD -->
    <div id="tab-scoreboard" class="tab-content">
        <div class="card">
            <h2>Underdog Scoreboard</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Tracking transformation momentum from Day 1 baseline.</p>
            <div id="stats-summary" style="margin-top: 12px; font-size: 0.95rem;"></div>
        </div>
    </div>

    <!-- TAB 3: SETTINGS & BACKUP -->
    <div id="tab-settings" class="tab-content">
        <div class="card">
            <h2>Data & Backup</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px;">Export all your local logs to a JSON backup file for total safety.</p>
            <button class="btn-secondary" onclick="exportData()">Export Data (.json)</button>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav>
        <button onclick="switchTab('today')" id="nav-today" class="active">📅 Log</button>
        <button onclick="switchTab('scoreboard')" id="nav-scoreboard">🏆 Scoreboard</button>
        <button onclick="switchTab('settings')" id="nav-settings">⚙️ Settings</button>
    </nav>

    <script>
        let currentDate = new Date().toISOString().split('T')[0];
        let appData = JSON.parse(localStorage.getItem('pocket_pt_data')) || {};

        function updateDateDisplay() {
            document.getElementById('display-date').innerText = currentDate;
            loadDayData(currentDate);
        }

        function changeDate(days) {
            let d = new Date(currentDate);
            d.setDate(d.getDate() + days);
            currentDate = d.toISOString().split('T')[0];
            updateDateDisplay();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('nav-' + tabName).classList.add('active');
            if(tabName === 'scoreboard') renderScoreboard();
        }

        function toggleHabit(habitKey) {
            if (!appData[currentDate]) appData[currentDate] = { habits: {} };
            if (!appData[currentDate].habits) appData[currentDate].habits = {};
            appData[currentDate].habits[habitKey] = !appData[currentDate].habits[habitKey];
            renderHabits();
        }

        function renderHabits() {
            const dayHabits = (appData[currentDate] && appData[currentDate].habits) || {};
            ['huel', 'gym', 'steps', 'water'].forEach(k => {
                const btn = document.getElementById('habit-' + k);
                if (dayHabits[k]) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        function saveDailyLog() {
            if (!appData[currentDate]) appData[currentDate] = { habits: {} };
            appData[currentDate].weight = document.getElementById('log-weight').value;
            appData[currentDate].mood = document.getElementById('log-mood').value;
            
            localStorage.setItem('pocket_pt_data', JSON.stringify(appData));
            alert('Saved successfully for ' + currentDate + '!');
            updateStreak();
        }

        function loadDayData(dateStr) {
            const data = appData[dateStr] || {};
            document.getElementById('log-weight').value = data.weight || '';
            document.getElementById('log-mood').value = data.mood || '';
            renderHabits();
        }

        function updateStreak() {
            let streak = 0;
            let d = new Date();
            while(true) {
                let key = d.toISOString().split('T')[0];
                if (appData[key] && (appData[key].weight || appData[key].mood)) {
                    streak++;
                    d.setDate(d.getDate() - 1);
                } else {
                    break;
                }
            }
            document.getElementById('current-streak').innerText = `🔥 ${streak} Day Streak`;
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "pocket_pt_backup_" + new Date().toISOString().split('T')[0] + ".json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function renderScoreboard() {
            const entries = Object.keys(appData).sort();
            let html = entries.length === 0 ? "No logs yet. Start logging from the calendar view!" : `<ul>`;
            entries.forEach(date => {
                let entry = appData[date];
                html += `<li style="margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border);">
                    <strong>${date}</strong><br>
                    Weight: ${entry.weight ? entry.weight + ' kg' : 'Not logged'}<br>
                    Notes: ${entry.mood || 'None'}
                </li>`;
            });
            html += `</ul>`;
            document.getElementById('stats-summary').innerHTML = html;
        }

        updateDateDisplay();
        updateStreak();
    </script>
</body>
</html>
